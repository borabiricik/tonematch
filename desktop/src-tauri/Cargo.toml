[package]
name = "tonematch-desktop"
version = "0.1.0"
description = "Desktop UI for tonematch (YouTube guitar tone -> BOSS GT-1)"
edition = "2021"

[lib]
name = "tonematch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
