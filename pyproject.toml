[project]
name = "tonematch"
version = "0.1.0"
description = "YouTube guitar tone -> BOSS GT-1 patch"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "yt-dlp>=2026.1.1",
    "mido>=1.3",
    "python-rtmidi>=1.5.8",
    "torch>=2.5",
    "torchaudio>=2.5",
    # CUDA build on Windows/Linux (RTX); macOS has no CUDA -> CPU/CoreML onnxruntime, torch from PyPI (MPS)
    "audio-separator[gpu]>=0.30; sys_platform != 'darwin'",
    "audio-separator[cpu]>=0.30; sys_platform == 'darwin'",
    "scikit-learn>=1.9.1",
    "anthropic>=1.0",
]

[project.scripts]
tonematch = "tonematch.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tonematch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: requires the GT-1 connected"]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 110
